name: CLA

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

# The only write permission is the CLA commit status on the PR head.
permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  cla:
    name: CLA
    if: github.event_name == 'pull_request' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      # Only the trusted base tree is checked out: contributor code never runs.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          path: trusted-cla
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
      - name: Check every commit author agreed to CLA.md
        working-directory: trusted-cla
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node packages/gate/src/io/check/cla.js
