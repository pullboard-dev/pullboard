name: Close inactive clarification issues

on:
  schedule:
    - cron: '23 4 * * *'

permissions:
  issues: write
  pull-requests: read

jobs:
  close-clarification-issues:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7.0.1
        with:
          script: |
            const cutoff = Date.now() - 14 * 24 * 60 * 60 * 1000;
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', labels: 'clarify', per_page: 100 });
            for (const issue of issues) {
              if (issue.pull_request || Date.parse(issue.updated_at) > cutoff) continue;
              await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: 'Closed. No response. Reply to reopen.' });
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed', state_reason: 'completed' });
            }
