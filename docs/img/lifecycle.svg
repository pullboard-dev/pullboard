<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 392" width="840" height="392" role="img" aria-labelledby="title desc">
<title id="title">An item's life</title><desc id="desc">Drawn from src/machine.js. An item starts open and ends verified or withdrawn. open to claimed: claim. claimed to open: release, lapse (clock), escalate, refreeze. claimed to submitted: submit. submitted to verified: accept. submitted to open: reject, reopen, refreeze. open to withdrawn: withdraw. claimed to withdrawn: withdraw. submitted to withdrawn: withdraw.</desc>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #1f2328; }
.mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
.card { fill: #ffffff; stroke: #d1d9e0; }
.head { font-size: 14px; font-weight: 600; }
.aside { font-size: 12px; fill: #59636e; }
.t1 { font-size: 14px; font-weight: 600; }
.t2 { font-size: 12px; fill: #59636e; }
.label { font-size: 12px; fill: #59636e; }
.code { font-size: 11.5px; fill: #59636e; }
.edge { fill: none; stroke: #8c959f; stroke-width: 1.5; }
.edge.back { stroke: #bc4c00; stroke-dasharray: 5 4; }
.edge.leader { stroke-width: 1; stroke-dasharray: 2 3; }
.tip { fill: #8c959f; }
.tip.back { fill: #bc4c00; }
.label.back { fill: #bc4c00; }
.frame { fill: none; stroke: #d1d9e0; stroke-dasharray: 4 4; }
.plain rect { fill: #f6f8fa; stroke: #d1d9e0; }
.person rect { fill: #ddf4ff; stroke: #54aeff; }
.person .t1 { fill: #0a3069; } .person .t2 { fill: #0550ae; }
.agent rect { fill: #fbefff; stroke: #c297ff; }
.agent .t1 { fill: #3e1f79; } .agent .t2 { fill: #6639ba; }
.check rect { fill: #fff8c5; stroke: #d4a72c; }
.check .t1 { fill: #4d2d00; } .check .t2 { fill: #7d4e00; }
.done rect { fill: #dafbe1; stroke: #4ac26b; }
.done .t1 { fill: #044f1e; } .done .t2 { fill: #116329; }
@media (prefers-color-scheme: dark) {
  text { fill: #f0f6fc; }
  .card { fill: #0d1117; stroke: #3d444d; }
  .aside, .t2, .label, .code { fill: #9198a1; }
  .edge { stroke: #6e7681; }
  .edge.back { stroke: #f0883e; }
  .tip { fill: #6e7681; }
  .tip.back, .label.back { fill: #f0883e; }
  .frame { stroke: #3d444d; }
  .plain rect { fill: #151b23; stroke: #3d444d; }
  .person rect { fill: #0c2d6b; stroke: #1f6feb; }
  .person .t1 { fill: #cae8ff; } .person .t2 { fill: #a5d6ff; }
  .agent rect { fill: #271052; stroke: #8957e5; }
  .agent .t1 { fill: #ecdeff; } .agent .t2 { fill: #d2a8ff; }
  .check rect { fill: #272115; stroke: #9e6a03; }
  .check .t1 { fill: #f8e3a1; } .check .t2 { fill: #e3b341; }
  .done rect { fill: #04260f; stroke: #238636; }
  .done .t1 { fill: #aff5b4; } .done .t2 { fill: #7ee787; }
}
</style>
<defs>
<marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path class="tip" d="M0 1 L9 5 L0 9 z"/></marker>
<marker id="tip-back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path class="tip back" d="M0 1 L9 5 L0 9 z"/></marker>
</defs>
<rect class="card" x="0.5" y="0.5" width="839" height="391" rx="12"/>
<text class="head" x="24" y="34">An item's life</text>
<text class="aside" x="140" y="34">starts open; ends verified or withdrawn</text>
<g class="plain"><rect x="25" y="150" width="160" height="58" rx="8"/><text class="t1" x="105" y="175" text-anchor="middle">open</text><text class="t2" x="105" y="193" text-anchor="middle">↻ escalate · refreeze</text></g>
<g class="plain"><rect x="235" y="150" width="160" height="58" rx="8"/><text class="t1" x="315" y="175" text-anchor="middle">claimed</text><text class="t2" x="315" y="193" text-anchor="middle">↻ claim</text></g>
<g class="plain"><rect x="445" y="150" width="160" height="58" rx="8"/><text class="t1" x="525" y="175" text-anchor="middle">submitted</text><text class="t2" x="525" y="193" text-anchor="middle">↻ reserve</text></g>
<g class="done" data-final="verified"><rect x="655" y="150" width="160" height="58" rx="8"/><rect x="659" y="154" width="152" height="50" rx="5" fill="none"/><text class="t1" x="735" y="184" text-anchor="middle">verified</text></g>
<g class="plain" data-final="withdrawn"><rect x="445" y="284" width="160" height="58" rx="8"/><rect x="449" y="288" width="152" height="50" rx="5" fill="none"/><text class="t1" x="525" y="318" text-anchor="middle">withdrawn</text></g>
<path class="edge" d="M 185 179 L 231 179" marker-end="url(#tip)"/>
<text class="label" x="208" y="171" text-anchor="middle">claim</text>
<path class="edge back" d="M 335 150 L 335 120 L 145 120 L 145 146" marker-end="url(#tip-back)"/>
<text class="label back" x="240" y="94" text-anchor="middle">release · lapse (clock)</text>
<text class="label back" x="240" y="109" text-anchor="middle">escalate · refreeze</text>
<path class="edge" d="M 395 179 L 441 179" marker-end="url(#tip)"/>
<text class="label" x="418" y="171" text-anchor="middle">submit</text>
<path class="edge" d="M 605 179 L 651 179" marker-end="url(#tip)"/>
<text class="label" x="628" y="171" text-anchor="middle">accept</text>
<path class="edge back" d="M 545 150 L 545 66 L 115 66 L 115 146" marker-end="url(#tip-back)"/>
<text class="label back" x="330" y="58" text-anchor="middle">reject · reopen · refreeze</text>
<path class="edge" d="M 105 208 L 105 313 L 441 313" marker-end="url(#tip)"/>
<text class="label" x="210" y="305" text-anchor="middle">withdraw</text>
<path class="edge" d="M 315 208 L 315 313"/>
<path class="edge" d="M 525 208 L 525 280" marker-end="url(#tip)"/>
<g class="plain"><rect x="640" y="26" width="176" height="94" rx="8"/></g>
<text class="label" x="652" y="46">every way into verified</text>
<text class="code mono" x="652" y="64">NOT_AT_COMMIT</text>
<text class="code mono" x="652" y="80">SELF_VERIFY</text>
<text class="code mono" x="652" y="96">CRITERIA_CHANGED</text>
<text class="code mono" x="652" y="112">PROOF_REQUIRED</text>
<path class="edge leader" d="M 735 122 L 735 146"/>
<g class="plain"><rect x="640" y="284" width="176" height="62" rx="8"/></g>
<text class="label" x="652" y="304">every way into withdrawn</text>
<text class="code mono" x="652" y="322">COORDINATOR_ONLY</text>
<text class="code mono" x="652" y="338">NOTE_REQUIRED</text>
<path class="edge leader" d="M 640 313 L 609 313"/>
<text class="aside" x="24" y="374">↻ a move that keeps the state · dashed: back to open · double border: final · codes: the refusal each guard raises</text>
</svg>
