<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 290" width="840" height="290" role="img" aria-labelledby="title desc">
<title id="title">How work moves</title><desc id="desc">You approve spec rows. Each item freezes its bar when an agent claims it. Builders, one per lane, build in their own worktrees; the gate must be green at the commit they submit. A second agent verifies that commit: an accept merges with its receipt, a reject sends the work back to the builder with the reason.</desc>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #1f2328; }
.mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
.card { fill: #ffffff; stroke: #d1d9e0; }
.head { font-size: 14px; font-weight: 600; }
.aside { font-size: 12px; fill: #59636e; }
.t1 { font-size: 14px; font-weight: 600; }
.t2 { font-size: 12px; fill: #59636e; }
.label { font-size: 12px; fill: #59636e; }
.code { font-size: 11.5px; fill: #59636e; }
.edge { fill: none; stroke: #8c959f; stroke-width: 1.5; }
.edge.back { stroke: #bc4c00; stroke-dasharray: 5 4; }
.edge.leader { stroke-width: 1; stroke-dasharray: 2 3; }
.tip { fill: #8c959f; }
.tip.back { fill: #bc4c00; }
.label.back { fill: #bc4c00; }
.frame { fill: none; stroke: #d1d9e0; stroke-dasharray: 4 4; }
.plain rect { fill: #f6f8fa; stroke: #d1d9e0; }
.person rect { fill: #ddf4ff; stroke: #54aeff; }
.person .t1 { fill: #0a3069; } .person .t2 { fill: #0550ae; }
.agent rect { fill: #fbefff; stroke: #c297ff; }
.agent .t1 { fill: #3e1f79; } .agent .t2 { fill: #6639ba; }
.check rect { fill: #fff8c5; stroke: #d4a72c; }
.check .t1 { fill: #4d2d00; } .check .t2 { fill: #7d4e00; }
.done rect { fill: #dafbe1; stroke: #4ac26b; }
.done .t1 { fill: #044f1e; } .done .t2 { fill: #116329; }
@media (prefers-color-scheme: dark) {
  text { fill: #f0f6fc; }
  .card { fill: #0d1117; stroke: #3d444d; }
  .aside, .t2, .label, .code { fill: #9198a1; }
  .edge { stroke: #6e7681; }
  .edge.back { stroke: #f0883e; }
  .tip { fill: #6e7681; }
  .tip.back, .label.back { fill: #f0883e; }
  .frame { stroke: #3d444d; }
  .plain rect { fill: #151b23; stroke: #3d444d; }
  .person rect { fill: #0c2d6b; stroke: #1f6feb; }
  .person .t1 { fill: #cae8ff; } .person .t2 { fill: #a5d6ff; }
  .agent rect { fill: #271052; stroke: #8957e5; }
  .agent .t1 { fill: #ecdeff; } .agent .t2 { fill: #d2a8ff; }
  .check rect { fill: #272115; stroke: #9e6a03; }
  .check .t1 { fill: #f8e3a1; } .check .t2 { fill: #e3b341; }
  .done rect { fill: #04260f; stroke: #238636; }
  .done .t1 { fill: #aff5b4; } .done .t2 { fill: #7ee787; }
}
</style>
<defs>
<marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path class="tip" d="M0 1 L9 5 L0 9 z"/></marker>
<marker id="tip-back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path class="tip back" d="M0 1 L9 5 L0 9 z"/></marker>
</defs>
<rect class="card" x="0.5" y="0.5" width="839" height="289" rx="12"/>
<text class="head" x="24" y="34">How work moves</text>
<g class="person"><rect x="40" y="62" width="200" height="64" rx="8"/><text class="t1" x="140" y="90" text-anchor="middle">You decide</text><text class="t2" x="140" y="108" text-anchor="middle">the rows of SPEC.md</text></g>
<g class="plain"><rect x="320" y="62" width="200" height="64" rx="8"/><text class="t1" x="420" y="90" text-anchor="middle">An item</text><text class="t2" x="420" y="108" text-anchor="middle">its bar frozen at claim</text></g>
<g class="agent"><rect x="610" y="52" width="200" height="64" rx="8"/><rect x="605" y="57" width="200" height="64" rx="8"/><rect x="600" y="62" width="200" height="64" rx="8"/><text class="t1" x="700" y="90" text-anchor="middle">Builders</text><text class="t2" x="700" y="108" text-anchor="middle">one per lane, own worktree</text></g>
<g class="check"><rect x="600" y="200" width="200" height="64" rx="8"/><text class="t1" x="700" y="228" text-anchor="middle">The gate</text><text class="t2" x="700" y="246" text-anchor="middle">tests green at the commit</text></g>
<g class="agent"><rect x="320" y="200" width="200" height="64" rx="8"/><text class="t1" x="420" y="228" text-anchor="middle">A verifier</text><text class="t2" x="420" y="246" text-anchor="middle">a second agent checks it</text></g>
<g class="done"><rect x="40" y="200" width="200" height="64" rx="8"/><text class="t1" x="140" y="228" text-anchor="middle">Merged</text><text class="t2" x="140" y="246" text-anchor="middle">with its receipt</text></g>
<path class="edge" d="M 240 94 L 316 94" marker-end="url(#tip)"/>
<path class="edge" d="M 520 94 L 596 94" marker-end="url(#tip)"/>
<path class="edge" d="M 700 126 L 700 196" marker-end="url(#tip)"/>
<path class="edge" d="M 600 232 L 524 232" marker-end="url(#tip)"/>
<path class="edge" d="M 320 232 L 244 232" marker-end="url(#tip)"/>
<path class="edge back" d="M 440 200 L 440 166 L 650 166 L 650 140" marker-end="url(#tip-back)"/>
<text class="label back" x="452" y="158">a reject sends it back</text>
</svg>
